[build]
command = "npm run build"
publish = "dist"

[build.environment]
NODE_VERSION = "22"

[functions]
directory = "netlify/functions"

[[headers]]
for = "/*"
[headers.values]
Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
X-Frame-Options = "DENY"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "no-referrer"

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
